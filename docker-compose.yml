  guacamole_db:
    image: postgres:15-alpine
    container_name: guacamole_db
    restart: always
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
    volumes:
      - ./guacamole/init/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
      - guac_db_data:/var/lib/postgresql/data
    networks:
      idmz-net:
        ipv4_address: 192.168.90.24

  guacamole-db-route-fixer:
    image: alpine:latest
    container_name: guacamole_db_route_fixer
    network_mode: "service:guacamole_db"
    cap_add:
      - NET_ADMIN
    command: sh -c "while true; do if ip addr show dev eth0 >/dev/null 2>&1; then ip route add 192.168.90.1 dev eth0 scope link 2>/dev/null || true; ip route replace default via 192.168.90.1 dev eth0 || exit 1; ip route del 192.168.90.0/24 dev eth0 2>/dev/null || true; else exit 1; fi; sleep 5; done"
    restart: always
    depends_on:
      guacamole_db:
        condition: service_started

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: always
    volumes:
      - ./guacamole/recordings:/var/lib/guacamole/recordings:rw
    networks:
      idmz-net:
        ipv4_address: 192.168.90.23

  guacd-route-fixer:
    image: alpine:latest
    container_name: guacd_route_fixer
    network_mode: "service:guacd"
    cap_add:
      - NET_ADMIN
    command: sh -c "while true; do if ip addr show dev eth0 >/dev/null 2>&1; then ip route add 192.168.90.1 dev eth0 scope link 2>/dev/null || true; ip route replace default via 192.168.90.1 dev eth0 || exit 1; ip route del 192.168.90.0/24 dev eth0 2>/dev/null || true; else exit 1; fi; sleep 5; done"
    restart: always
    depends_on:
      guacd:
        condition: service_started

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    hostname: guacamole
    restart: always
    environment:
      POSTGRESQL_HOSTNAME: 192.168.90.24
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole_user
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
      GUACD_HOSTNAME: 192.168.90.23
      RECORDING_SEARCH_PATH: /var/lib/guacamole/recordings
      WEBAPP_CONTEXT: ROOT
    volumes:
      - ./guacamole/recordings:/var/lib/guacamole/recordings:ro
      - ./guacamole/extensions:/home/guacamole/.guacamole/extensions
      - ./guacamole/logback.xml:/etc/guacamole/logback.xml:ro
    depends_on:
      - guacamole_db
      - guacd
    networks:
      idmz-net:
        ipv4_address: 192.168.90.22

  guacamole-route-fixer:
    image: alpine:latest
    container_name: guacamole_route_fixer
    network_mode: "service:guacamole"
    cap_add:
      - NET_ADMIN
    command: sh -c "while true; do if ip addr show dev eth0 >/dev/null 2>&1; then ip route add 192.168.90.1 dev eth0 scope link 2>/dev/null || true; ip route replace default via 192.168.90.1 dev eth0 || exit 1; ip route del 192.168.90.0/24 dev eth0 2>/dev/null || true; else exit 1; fi; sleep 5; done"
    restart: always
    depends_on:
      guacamole:
        condition: service_started


  # --- Wazuh SIEM Stack ---
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.3
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh_config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh_config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh_config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh_config/wazuh_config:/wazuh-config-mount/etc/ossec.conf
      - ./wazuh_config/rules.xml:/var/ossec/etc/rules/local_rules.xml
      - ./wazuh_config/decoders.xml:/var/ossec/etc/decoders/local_decoder.xml
    networks:
      e-enterprise-net:
        ipv4_address: 192.168.100.51

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.3
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh_config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./wazuh_config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./wazuh_config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./wazuh_config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./wazuh_config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./wazuh_config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./wazuh_config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    networks:
      e-enterprise-net:
        ipv4_address: 192.168.100.52

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.3
    hostname: wazuh.dashboard
    restart: always
    ports:
      - 5601:5601
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - ./wazuh_config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh_config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh_config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh_config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh_config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks:
      e-enterprise-net:
        ipv4_address: 192.168.100.50
      a-grfics-admin:
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

networks:
  b-basic-control-net:
    driver: macvlan
    driver_opts:
      parent: wlan0.95 
    ipam:
      config:
        - subnet: 192.168.95.0/24
          gateway: 192.168.95.1

  idmz-net:
    driver: macvlan
    driver_opts:
      parent: wlan0.90 # Replace with your actual host NIC
    ipam:
      config:
        - subnet: 192.168.90.0/24
          gateway: 192.168.90.1

  c-supervisory-net:
    driver: macvlan
    driver_opts:
      parent: wlan0.96
    ipam:
      config:
        - subnet: 192.168.96.0/24
          gateway: 192.168.96.1

  d-man-ops-net:
    driver: macvlan
    driver_opts:
      parent: wlan0.97
    ipam:
      config:
        - subnet: 192.168.97.0/24
          gateway: 192.168.97.1

  e-enterprise-net:
    driver: macvlan
    driver_opts:
      parent: wlan0.100 # Replace with your actual host NIC
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
  
  a-grfics-admin:
    driver: bridge


volumes:
  scadalts_db:
    name: scadalts_db
  plc_volume:
    name: plc_volume
  router_config:
    name: router_config
  nexterm:
  guac_db_data:
  keycloak_data:
  keycloak_logs:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
