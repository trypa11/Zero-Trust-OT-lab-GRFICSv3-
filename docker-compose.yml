services:
  simulation:
    image: fortiphyd/grfics-simulation
    container_name: simulation
    hostname: simulation
    build: ./simulation
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "55555"]
      interval: 5s
      retries: 5
    networks:
      b-basic-control-net:
        ipv4_address: 192.168.95.10

    # Optional if you want to override default CMD
    # command: sh -c "./simulation/simulation & cd modbus && ./run_all.sh"

  plc:
    image: fortiphyd/grfics-plc
    container_name: plc
    hostname: plc
    build: ./plc
    cap_add:
      - NET_ADMIN
    networks:
      b-basic-control-net:
        ipv4_address: 192.168.95.2
    volumes:
      - plc_volume:/docker_persistent 
    # Optional if you want to override default CMD
    # command: sh -c "./simulation/simulation & cd modbus && ./run_all.sh"

  ews:
    image: fortiphyd/grfics-workstation
    container_name: EWS
    hostname: EWS
    build: ./workstation
    cap_add:
      - NET_ADMIN
    networks:
      d-man-ops-net:
        ipv4_address: 192.168.97.5
    volumes:
      - /var/log/wazuh
    # Optional if you want to override default CMD
    # command: sh -c "./simulation/simulation & cd modbus && ./run_all.sh"

  hmi:
    image: fortiphyd/grfics-scadalts
    container_name: HMI
    build: ./scadalts
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    networks:
      c-supervisory-net:
        ipv4_address: 192.168.96.10
    volumes:
      - scadalts_db:/var/lib/mysql
    # Optional if you want to override default CMD
    # command: sh -c "./simulation/simulation & cd modbus && ./run_all.sh"

  kali:
    image: fortiphyd/grfics-attacker
    container_name: kali
    hostname: kali
    build: ./attacker
    cap_add:
      - NET_ADMIN
    ports:
      - "6088:6080"
    networks:
      e-enterprise-net:
        ipv4_address: 192.168.100.100
      a-grfics-admin:
    volumes:
      - ./attacker/start.sh:/usr/local/bin/start.sh:ro
      - ./attacker/attack_automation.sh:/home/kali/Desktop/attack_automation.sh:ro
      - ./attacker/attack_suite.py:/home/kali/Desktop/attack_suite.py:ro
    sysctls:
      net.ipv4.conf.default.arp_announce: 2
      net.ipv4.conf.all.arp_announce: 2

  router:
    image: fortiphyd/grfics-router
    container_name: router
    hostname: router
    build: ./router
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:5000/ || exit 1; ip addr | grep -q 192.168.90.1 || exit 1; iptables -L FORWARD | grep -q LOGDROP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: '1'
    environment:
      - FWUI_SECRET_KEY=${ROUTER_FWUI_SECRET_KEY}
      - ROUTER_ADMIN_USER=${ROUTER_ADMIN_USER}
      - ROUTER_ADMIN_PASSWORD=${ROUTER_ADMIN_PASSWORD}
    volumes:
      - ./router/setup-firewall.sh:/setup-firewall.sh:ro
      - router_config:/etc/firewall
      - /var/log/wazuh
      - keycloak_logs:/var/log/keycloak
    networks:
      a-grfics-admin:
      b-basic-control-net:
        ipv4_address: 192.168.95.200
      idmz-net:
        ipv4_address: 192.168.90.200
      c-supervisory-net:
        ipv4_address: 192.168.96.200
      d-man-ops-net:
        ipv4_address: 192.168.97.200
      e-enterprise-net:
        ipv4_address: 192.168.100.200

#  caldera:
#    image: fortiphyd/grfics-caldera
#    container_name: caldera
#    hostname: caldera
#    build: ./caldera
#    restart: unless-stopped
#    ports:
#      - "8888:8888"
#    networks:
#      e-enterprise-net:
#        ipv4_address: 192.168.100.101
#    volumes:
#      - /var/log/wazuh

  # --- Identity & Zero Trust ---
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_HOSTNAME: keycloak.localhost.pomerium.io
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KC_LOG: "console,file"
      KC_LOG_FILE: "/opt/keycloak/data/logs/keycloak.log"
      KC_LOG_CONSOLE_OUTPUT: "json"
      KC_LOG_FILE_OUTPUT: "json"
      KC_LOG_LEVEL: "INFO,org.keycloak.events:info"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - keycloak_logs:/opt/keycloak/data/logs
    networks:
      e-enterprise-net:
        ipv4_address: 192.168.100.20
      a-grfics-admin:
        aliases:
          - keycloak.localhost.pomerium.io

  keycloak-route-fixer:
    image: alpine:latest
    container_name: keycloak_route_fixer
    network_mode: "service:keycloak"
    cap_add:
      - NET_ADMIN
    command: sh -c "while true; do if ip addr show dev eth0 >/dev/null 2>&1; then ip route replace 192.168.0.0/16 via 192.168.100.1 || exit 1; else exit 1; fi; sleep 5; done"
    restart: always
    depends_on:
      keycloak:
        condition: service_started

      
  pomerium:
    image: pomerium/pomerium:latest
    container_name: pomerium
    ports:
      - "443:443"
    volumes:
      - ./pomerium/config.yaml:/pomerium/config.yaml
    networks:
      idmz-net:
        ipv4_address: 192.168.90.21
      a-grfics-admin:
    environment:
      - IDP_PROVIDER=${POMERIUM_IDP_PROVIDER}
      - IDP_CLIENT_ID=${POMERIUM_IDP_CLIENT_ID}
      - IDP_CLIENT_SECRET=${POMERIUM_IDP_CLIENT_SECRET}
      - SIGNING_KEY=${POMERIUM_SIGNING_KEY}
      - SHARED_SECRET=${SHARED_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}

  pomerium-route-fixer:
    image: alpine:latest
    container_name: pomerium_route_fixer
    network_mode: "service:pomerium"
    cap_add:
      - NET_ADMIN
    command: >-
      sh -c "
        while true; do
          IFACE=$$(ip -4 addr show 2>/dev/null | grep '192.168.90' | awk '{print $$NF}');
          if [ -n \"$$IFACE\" ]; then
            ip route add 192.168.90.1 dev $$IFACE scope link 2>/dev/null || true;
            ip route replace default via 192.168.90.1 dev $$IFACE || exit 1;
            for SUBNET in 192.168.95.0/24 192.168.96.0/24 192.168.100.0/24; do
              ip route replace $$SUBNET via 192.168.90.1 dev $$IFACE || exit 1;
            done
            ip route del 192.168.90.0/24 dev $$IFACE 2>/dev/null || true;
          else
            exit 1;
          fi;
          sleep 5;
        done
      "
    restart: always
    depends_on:
      pomerium:
        condition: service_started
