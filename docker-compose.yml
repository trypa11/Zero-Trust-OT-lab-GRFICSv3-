services:
  simulation:
    image: fortiphyd/grfics-simulation
    container_name: simulation
    hostname: simulation
    build: ./simulation
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "55555"]
      interval: 5s
      retries: 5
    networks:
      b-basic-control-net:
        ipv4_address: 192.168.95.10
    volumes:
      - /var/log/wazuh
    # Optional if you want to override default CMD
    # command: sh -c "./simulation/simulation & cd modbus && ./run_all.sh"

  plc:
    image: fortiphyd/grfics-plc
    container_name: plc
    hostname: plc
    build: ./plc
    cap_add:
      - NET_ADMIN
    networks:
      b-basic-control-net:
        ipv4_address: 192.168.95.2
    volumes:
      - plc_volume:/docker_persistent 
    # Optional if you want to override default CMD
    # command: sh -c "./simulation/simulation & cd modbus && ./run_all.sh"

  ews:
    image: fortiphyd/grfics-workstation
    container_name: EWS
    hostname: EWS
    build: ./workstation
    cap_add:
      - NET_ADMIN
    networks:
      d-man-ops-net:
        ipv4_address: 192.168.97.5
    volumes:
      - /var/log/wazuh
    # Optional if you want to override default CMD
    # command: sh -c "./simulation/simulation & cd modbus && ./run_all.sh"

  hmi:
    image: fortiphyd/grfics-scadalts
    container_name: HMI
    build: ./scadalts
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    networks:
      c-supervisory-net:
        ipv4_address: 192.168.96.10
    volumes:
      - scadalts_db:/var/lib/mysql
    # Optional if you want to override default CMD
    # command: sh -c "./simulation/simulation & cd modbus && ./run_all.sh"

  kali:
    image: fortiphyd/grfics-attacker
    container_name: kali
    hostname: kali
    build: ./attacker
    cap_add:
      - NET_ADMIN
    ports:
      - "6088:6080"
    networks:
      idmz-net:
        ipv4_address: 192.168.90.6
      a-grfics-admin:
    sysctls:
      net.ipv4.conf.default.arp_announce: 2
      net.ipv4.conf.all.arp_announce: 2
    volumes:
      - /var/log/wazuh

  router:
    image: fortiphyd/grfics-router
    container_name: router
    hostname: router
    build: ./router
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "ip route | grep -q 192.168.95.0 || exit 1"]
      interval: 5s
      retries: 5
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: '1'
    environment:
      - FWUI_SECRET_KEY=${ROUTER_FWUI_SECRET_KEY}
      - ROUTER_ADMIN_USER=${ROUTER_ADMIN_USER}
      - ROUTER_ADMIN_PASSWORD=${ROUTER_ADMIN_PASSWORD}
    volumes:
      - router_config:/etc/firewall
      - /var/log/wazuh
      - keycloak_logs:/var/log/keycloak
    networks:
      a-grfics-admin:
      b-basic-control-net:
        ipv4_address: 192.168.95.200
      idmz-net:
        ipv4_address: 192.168.90.200
      c-supervisory-net:
        ipv4_address: 192.168.96.200
      d-man-ops-net:
        ipv4_address: 192.168.97.200
      e-enterprise-net:
        ipv4_address: 192.168.100.200

  caldera:
    image: fortiphyd/grfics-caldera
    container_name: caldera
    hostname: caldera
    build: ./caldera
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      idmz-net:
        ipv4_address: 192.168.90.250
    volumes:
      - /var/log/wazuh

  # --- Identity & Zero Trust ---
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_HOSTNAME: keycloak.localhost.pomerium.io
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_LOG: "console,file"
      KC_LOG_FILE: "/opt/keycloak/data/logs/keycloak.log"
      KC_LOG_FILE_FORMAT: "json"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - keycloak_logs:/opt/keycloak/data/logs
    networks:
      e-enterprise-net:
        ipv4_address: 192.168.100.20
      a-grfics-admin:
        aliases:
          - keycloak.localhost.pomerium.io

  keycloak-route-fixer:
    image: alpine:latest
    container_name: keycloak_route_fixer
    network_mode: "service:keycloak"
    cap_add:
      - NET_ADMIN
    command: sh -c "sleep 2 && ip route add 192.168.0.0/16 via 192.168.100.1 && tail -f /dev/null"
    restart: always
    depends_on:
      keycloak:
        condition: service_started

      
  pomerium:
    image: pomerium/pomerium:latest
    container_name: pomerium
    ports:
      - "443:443"
    volumes:
      - ./pomerium/config.yaml:/pomerium/config.yaml
    networks:
      idmz-net:
        ipv4_address: 192.168.90.21
      a-grfics-admin:
    environment:
      - IDP_PROVIDER=${POMERIUM_IDP_PROVIDER}
      - IDP_CLIENT_ID=${POMERIUM_IDP_CLIENT_ID}
      - IDP_CLIENT_SECRET=${POMERIUM_IDP_CLIENT_SECRET}
      - SIGNING_KEY=${POMERIUM_SIGNING_KEY}

  pomerium-route-fixer:
    image: alpine:latest
    container_name: pomerium_route_fixer
    network_mode: "service:pomerium"
    cap_add:
      - NET_ADMIN
    command: sh -c "sleep 2 && ip route replace default via 192.168.90.1 dev eth1 && tail -f /dev/null"
    restart: always
    depends_on:
      pomerium:
        condition: service_started
  nexterm:
    image: germannewsmaker/nexterm:latest
    container_name: nexterm
    hostname: nexterm
    restart: always
    cap_add:
      - NET_ADMIN
    entrypoint: ["sh", "-c", "syslogd -R 192.168.100.51:514 && exec /usr/local/bin/docker-entrypoint.sh /bin/sh docker-start.sh"]
    environment:
      - ENCRYPTION_KEY=${NEXTERM_ENCRYPTION_KEY}
    volumes:
      - nexterm:/app/data
    networks:
      idmz-net:
        ipv4_address: 192.168.90.22


  # --- Wazuh SIEM Stack ---
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.3
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    networks:
      e-enterprise-net:
        ipv4_address: 192.168.100.51

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.3
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    networks:
      e-enterprise-net:
        ipv4_address: 192.168.100.52

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.3
    hostname: wazuh.dashboard
    restart: always
    ports:
      - 5601:5601
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks:
      e-enterprise-net:
        ipv4_address: 192.168.100.50
      a-grfics-admin:
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

networks:
  b-basic-control-net:
    driver: macvlan
    driver_opts:
      parent: wlan0.95 
    ipam:
      config:
        - subnet: 192.168.95.0/24
          gateway: 192.168.95.1

  idmz-net:
    driver: macvlan
    driver_opts:
      parent: wlan0.90 # Replace with your actual host NIC
    ipam:
      config:
        - subnet: 192.168.90.0/24
          gateway: 192.168.90.1

  c-supervisory-net:
    driver: macvlan
    driver_opts:
      parent: wlan0.96
    ipam:
      config:
        - subnet: 192.168.96.0/24
          gateway: 192.168.96.1

  d-man-ops-net:
    driver: macvlan
    driver_opts:
      parent: wlan0.97
    ipam:
      config:
        - subnet: 192.168.97.0/24
          gateway: 192.168.97.1

  e-enterprise-net:
    driver: macvlan
    driver_opts:
      parent: wlan0.100 # Replace with your actual host NIC
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
  
  a-grfics-admin:
    driver: bridge

volumes:
  scadalts_db:
    name: scadalts_db
  plc_volume:
    name: plc_volume
  router_config:
    name: router_config
  nexterm:
  keycloak_data:
  keycloak_logs:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom: